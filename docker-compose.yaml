# JXVisionAI + Redis + MinIO（S3 兼容，可换为云 S3：改环境变量并去掉 minio 服务）
# 使用：docker-compose up -d --build
# 管理界面：http://localhost:5000
# MinIO 控制台：http://localhost:9001 用户/密码同 MINIO_ROOT_*
# Redis 对外端口 16379

services:
  minio:
    image: minio/minio:latest
    container_name: visionai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: visionai-redis
    working_dir: /data
    command: redis-server --dir /data --appendonly yes --appenddirname appendonlydir --requirepass VisionAI@2026 --stop-writes-on-bgsave-error no
    ports:
      - "16379:6379"
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "VisionAI@2026", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


