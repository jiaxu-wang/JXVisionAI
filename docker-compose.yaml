# JXVisionAI + Redis + MinIO + ZLMediaKit（host 网络）
# 使用：./scripts/install_linux.sh（推荐）或 cp .env.example .env 填密钥后 docker compose up -d --build
#
# 全部服务 network_mode: host —— ONVIF WS-Discovery 组播、国标 RTP 收流都要求宿主机网络。
# 端口直接绑宿主机（与旧桥接映射保持一致，无 ports 映射）：
#   Web 15000 | Redis 16379 | MinIO 19000/19001 | ZLM HTTP 18080 | RTSP 18554 | RTMP 11935
#   WebRTC 18000 | 国标 SIP 15060 | PS/RTP 10000-10200
#
# 应用拆为四服务（同镜像）：visionai-api / visionai-worker / visionai-alert / visionai-sip
# 模型与配置通过 volume 挂载，改 config.ini / 换权重后重启对应容器即可。

# 注意：build 只挂在 visionai-api 上。四个服务共用同一镜像 visionai:latest，
# 若每个服务都带 build，compose v5(bake) 会并行构建同一 tag，导出时竞态报
# "image ... already exists"。其余服务只引用 image，构建一次即可。
x-visionai-common: &visionai-common
  image: visionai:latest
  network_mode: host
  environment: &visionai-env
    # 应用时区（IANA）。优先环境变量 VISIONAI_TIMEZONE；未设则读 config.ini [basic] timezone
    VISIONAI_TIMEZONE: ${VISIONAI_TIMEZONE:-}
    TZ: ${VISIONAI_TIMEZONE:-Asia/Shanghai}
    REDIS_HOST: 127.0.0.1
    REDIS_PORT: "16379"
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_DB: "0"
    VISIONAI_SECRET: ${VISIONAI_SECRET}
    VISIONAI_SESSION_SECRET: ${VISIONAI_SESSION_SECRET:-}
    VISIONAI_ALLOW_PROCESS_RESTART: ${VISIONAI_ALLOW_PROCESS_RESTART:-0}
    SAVE_DIR: /app/snapshots
    LOG_DIR: /app/logs
    INFERENCE_DEVICE: ${INFERENCE_DEVICE:-cpu}
    ONNX_PROVIDER: ${ONNX_PROVIDER:-cpu}
    OBJECT_STORAGE_ENABLED: "true"
    OBJECT_STORAGE_KEEP_LOCAL: "true"
    S3_ENDPOINT_URL: http://127.0.0.1:19000
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    S3_BUCKET: visionai
    S3_USE_SSL: "false"
    S3_REGION: us-east-1
    ZLM_ENABLED: "true"
    ZLM_API_BASE: http://127.0.0.1:18080
    ZLM_SECRET: ${ZLM_SECRET}
    ZLM_HTTP_PORT: "18080"
    ZLM_RTSP_PORT: "18554"
    ZLM_APP: "jvai"
    ZLM_PUBLIC_HOST: "127.0.0.1"
    ZLM_RTC_PORT: "18000"
    ZLM_PULL_HOST: 127.0.0.1
    ZLM_PULL_RTSP_PORT: "18554"
    ZLM_PREFER_LOCAL_PULL: "true"
    ZLM_FALLBACK_DIRECT_RTSP: "true"
    NO_PROXY: "127.0.0.1,localhost"
    no_proxy: "127.0.0.1,localhost"
  volumes:
    - ./snapshots:/app/snapshots
    - ./logs:/app/logs
    - ./config:/app/config
    - ./models:/app/models
    - ./visionai:/app/visionai
    - ./docker/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    - /usr/share/fonts:/usr/share/fonts:ro
  depends_on:
    redis:
      condition: service_healthy
    minio:
      condition: service_started
    zlmediakit:
      condition: service_started
  restart: unless-stopped

services:
  minio:
    image: minio/minio:latest
    container_name: visionai-minio
    network_mode: host
    # host 网络：直接绑宿主机 19000（S3 API）/ 19001（控制台）
    command: server /data --address ":19000" --console-address ":19001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: visionai-redis
    network_mode: host
    working_dir: /data
    # host 网络：绑 16379，避开宿主机可能存在的 6379
    command:
      - redis-server
      - --port
      - "16379"
      - --dir
      - /data
      - --appendonly
      - "yes"
      - --appenddirname
      - appendonlydir
      - --requirepass
      - ${REDIS_PASSWORD}
      - --stop-writes-on-bgsave-error
      - "no"
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 16379 -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  zlmediakit:
    image: zlmediakit/zlmediakit:master
    container_name: visionai-zlm
    network_mode: host
    volumes:
      # host 网络专用配置：HTTP 18080 / RTSP 18554 / RTMP 11935 / WebRTC 18000 / RTP 10000-10200
      - ./config/zlm/config.host.ini:/opt/media/conf/config.ini:ro
      - ./logs/zlm:/opt/media/bin/log
    restart: unless-stopped

  visionai-api:
    <<: *visionai-common
    container_name: visionai-api
    # 唯一的 build 定义：产出 visionai:latest，worker/alert/sip 共用
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ORT_PKG: ${ORT_PKG:-onnxruntime}
    command: ["api"]
    environment:
      <<: *visionai-env
      PORT: "15000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:15000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  visionai-worker:
    <<: *visionai-common
    container_name: visionai-worker
    command: ["worker"]
    environment:
      <<: *visionai-env
      WORKER_ID: compose-worker-1
    healthcheck:
      disable: true

  visionai-alert:
    <<: *visionai-common
    container_name: visionai-alert
    command: ["alert"]
    healthcheck:
      disable: true

  visionai-sip:
    <<: *visionai-common
    container_name: visionai-sip
    command: ["sip"]
    healthcheck:
      disable: true
