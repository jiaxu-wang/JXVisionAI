# 复制为 config.ini 后按需修改。优先级：环境变量 > 本文件 > 程序内置默认值。
# Docker：挂载 ./config:/app/config；compose 里的 environment 会覆盖本文件中的 redis_host 等。
# 本机 ./start.sh：脚本会默认 export REDIS_HOST=127.0.0.1、REDIS_PORT=16379，避免写死的 redis:6379 在宿主机无法解析。

[visionai]
# Flask 登录会话密钥（生产务必修改）
# visionai_secret = 123456-bb6b-4889-a715-d9eb2d1925cc
# 可选兼容键名：secret = ...

# 检测
# detection_interval = 15
# conf_threshold = 0.5

# 人员聚集（单帧检出人数 ≥ 阈值；与「人物」告警独立，开「人员聚集」即采集 person 框）
# gather_min_persons = 2
# 满足人数条件后需持续该秒数才告警（0 表示立即告警）
# gather_min_duration_sec = 0

# 吸烟（行为层 ONNX 分类；可用 scripts/export_smoking_onnx.py 从 Hugging Face 导出 ViT）
# smoking_model_path = /app/models/smoking_vit.onnx
# vit_hf = 与 export 脚本默认 ViT 一致；imagenet = 自训 ResNet 等
# smoking_preprocess = vit_hf
# 公开 ViT 易误报（手在嘴边）：可提高阈值（0.85~0.92）与 min_duration_sec（1.5~3）
# smoking_conf_threshold = 0.58
# smoking_input_size = 224
# smoking_person_pad_ratio = 0.15
# smoking_min_duration_sec = 2.0
# smoking_max_persons_per_frame = 8
# smoking_positive_class_index = 1
# smoking_log_scores = true
#
# 可选香烟门控：专训「香烟」目标的 YOLO（Ultralytics .pt），与本帧人物框有交集（或烟头中心在人体框附近）才对人物裁剪做 ViT 吸烟二分类，显著降低「手捂嘴」误报；权重需自训或使用公开数据集导出
# smoking_cigarette_detector_path =
# smoking_cigarette_detector_conf = 0.35
# 单类模型一般为 0；多类时请写只含香烟类别的 id；留空不按类过滤

# smoking_cigarette_class_ids =
# 截图与模型
# save_dir = ./snapshots
# save_interval = 10
# yolo_model = yolov8n.pt

# Ultralytics（主检测 / 通话·玩手机姿态共用）：不写或 auto = 交给库自动选显卡；强制 CPU = cpu；单卡通常为 0
# yolo_device =

# 吸烟等行为 ONNX：`cpu`；`cuda_first` = CUDAExecutionProvider（含 GPU 轮子时）先于 CPU


# onnx_provider = cpu


# 打电话 / 玩手机：YOLO+COCO 人机框重叠后再跑姿态（Ultralytics yolov8n-pose），用手机中心与肩颈/耳根/手腕的距离区分
# 仅用短文件名会自动从网上拉权重；GitHub SSL 失败时请本机先下载 .pt 再设绝对路径（如 /app/models/yolov8n-pose.pt）。
# curl -Lo models/yolov8n-pose.pt "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolov8n-pose.pt"
# pose_model = yolov8n-pose.pt
# pose_for_phone_enabled = true
# phone_pose_kp_min_conf = 0.28
# phone_call_head_ratio = 0.26
# phone_play_wrist_ratio = 0.20
# phone_vertical_boundary = 0.42

# 日志（UTF-8；按日轮转）
# log_level = INFO
# log_retention_days = 3
# log_dir = ./logs

# Redis
# redis_host = 192.168.2.159
# redis_port = 16379
# redis_password = VisionAI@2026
# redis_db = 0
# redis_key_prefix = visionai/

# 检测记录过期（天）
# detection_retention_days = 1

# 管理端
# auto_refresh_interval = 20

# 流预览：低延迟选项（WebSocket / HLS）。含检测框时 MJPEG 与 WS 的轮询间隔（秒）
# preview_annotated_poll_sec = 0.05
# WebSocket 原画模式下的最高 FPS（愈高愈跟手，占用略增）
# preview_ws_max_fps = 30
# HLS：依赖本机 ffmpeg；分片愈短延迟愈低、转码 CPU 愈高；关闭窗口或空闲 preview_hls_idle_sec 秒后停止进程
# preview_hls_enabled = true
# preview_hls_root = ./hls-preview
# preview_hls_segment_sec = 0.5
# preview_hls_list_size = 6
# preview_hls_idle_sec = 120
# WebRTC 预览（aiortc + PyAV）；关闭则管理端不展示该选项；可配置多 STUN（逗号分隔）
# preview_webrtc_enabled = true
# preview_webrtc_stun_urls = stun:stun.l.google.com:19302

# 告警外发邮件（全局 SMTP；每路流的收件人与邮件开关在 Web「事件监控」：alert_emails、alert_email_enabled）
# Webhook 告警无全局 ini，仅每路 Redis：alert_webhook_urls（列表）、alert_webhook_enabled；成功写 Redis 后 POST JSON。
# smtp_alert_enabled = true
# smtp_host = smtp.example.com
# smtp_port = 587
# smtp_use_tls = true
# smtp_use_ssl = false
# smtp_user =
# smtp_password =
# smtp_from = visionai@example.com
# smtp_timeout = 30
# 附件截图最大字节（仅当本地仍有 jpeg 文件时附上；默认约 5MB）
# smtp_alert_attach_max_bytes = 5242880

# 对象存储（S3 兼容：MinIO / AWS 等，键前缀下可再分子目录供视频等扩展）
# 宿主机跑应用、MinIO 仅 Docker 映射端口：http://127.0.0.1:9000，且 http(s)_proxy 勿拦截（NO_PROXY 含 127.0.0.1）
# 应用与 MinIO 同在 compose：http://minio:9000
# object_storage_enabled = false
# object_storage_keep_local = true
# s3_endpoint_url = http://127.0.0.1:9000
# s3_access_key_id =
# s3_secret_access_key =
# s3_bucket = visionai
# s3_region = us-east-1
# s3_use_ssl = true
# s3_path_prefix = visionai/
# s3_addressing_style = path
# 为 snapshots/ 前缀自动配置桶生命周期，天数与 detection_retention_days 一致
# s3_lifecycle_enabled = true
