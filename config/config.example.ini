# 复制为 config.ini 后按需修改。
# 优先级：环境变量 > 本文件 > 程序内置默认值。
# 本机跑 ./start.sh 时脚本会 export 覆盖 REDIS_HOST/PORT、SAVE_DIR、LOG_DIR、S3_ENDPOINT_URL 等。
# 相对路径均相对项目根目录；也可用绝对路径或 http(s):// URL。
# 仍兼容旧版单节 [visionai]（键用规范全名，如 redis_host、smtp_host）。

# ========================= 基础配置 =========================
[basic]
# Web 管理端登录密钥（环境变量 VISIONAI_SECRET 可覆盖）；生产务必修改
visionai_secret = 123456-bb6b-4889-a715-d9eb2d1925cc
# 检测间隔（秒）：每隔多少秒对取流帧跑一次 YOLO+行为层；越小越灵敏、CPU 越高
detection_interval = 1
# YOLO 主检测置信度阈值（0~1）；低于该值的框丢弃
conf_threshold = 0.5
# 告警截图本地保存目录（Docker 常映射 ./snapshots -> /app/snapshots）
save_dir = ./snapshots
# 同一路流两次落盘/发告警的最小间隔（秒），用于限流
save_interval = 10
# ---------- 推理设备（改完重启生效）----------
# 总开关：cpu | gpu —— 同时控制 YOLO(PyTorch) 与 ONNX（人脸等）
# 对比效果时只改这一行：inference_device = cpu  或  inference_device = gpu
inference_device = gpu
# 分项（仅当总开关留空时生效）：
# yolo_device = 0
# onnx_provider = cuda_first
# 日志级别：DEBUG / INFO / WARNING / ERROR
log_level = INFO
# 日志文件保留天数（TimedRotating）
log_retention_days = 3
# 日志目录（Docker 常映射 ./logs -> /app/logs）
log_dir = ./logs
# 检测记录在 Redis 中的 TTL（天，≥1）；同时作为 MinIO/S3 截图生命周期过期天数
detection_retention_days = 1
# 管理端状态/历史等页面自动刷新间隔（秒）
auto_refresh_interval = 20
# 应用时区（IANA，告警落库与历史页展示）；环境变量 VISIONAI_TIMEZONE / TZ 可覆盖
# 示例：Asia/Shanghai | Europe/Berlin | America/New_York | UTC
timezone = Asia/Shanghai

# ========================= Redis =========================
[redis]
# Redis 主机；Compose 内可用 redis；宿主机直连常用 127.0.0.1（环境变量 REDIS_HOST 可覆盖）
host = 127.0.0.1
# Redis 端口；compose 对外映射多为 16379，容器内为 6379（REDIS_PORT 可覆盖）
port = 16379
# Redis 密码（requirepass）；空表示无密码
password = VisionAI@2026
# Redis 逻辑库编号（0~15）
db = 0
# Redis 键前缀（流配置、检测记录、人脸库等）；勿随意改以免读不到旧数据
key_prefix = visionai/

# ========================= MinIO / S3 =========================
[minio]
# 是否启用对象存储上传截图/人脸照片；false=仅本地 save_dir
enabled = true
# 上传对象存储后是否仍保留本地文件副本（排障建议 true）
keep_local = true
# S3 兼容 API 端点；宿主机+compose 映射 19000 用 127.0.0.1；同 compose 网络可用 http://minio:9000
endpoint_url = http://127.0.0.1:19000
# 访问密钥 Access Key ID
access_key_id = minioadmin
# 密钥 Secret Access Key
secret_access_key = minioadmin
# 桶名称（不存在时应用可尝试创建）
bucket = visionai
# 区域名；MinIO 常用 us-east-1
region = us-east-1
# 是否 HTTPS（内网 MinIO HTTP 填 false；公网 HTTPS 填 true）
use_ssl = false
# 对象键公共前缀；截图在 {path_prefix}snapshots/ 下
path_prefix = visionai/
# 寻址风格：path（MinIO 推荐）或 virtual（虚拟主机风格）
addressing_style = path
# 启动时是否写入桶生命周期规则（过期天数= detection_retention_days）
lifecycle_enabled = true

# ========================= 邮箱（SMTP） =========================
[email]
# 全局是否启用邮件告警；每路是否发送/收件人仍在「事件监控」Redis 流配置中设置
alert_enabled = false
# SMTP 服务器主机名，如 smtp.qq.com、smtp.exmail.qq.com
host =
# SMTP 端口；常用 465(SSL) / 587(STARTTLS) / 25
port = 587
# 是否使用隐式 SSL（端口 465 时一般为 true，此时 use_tls 一般为 false）
use_ssl = false
# 是否使用 STARTTLS（端口 587 时一般为 true）
use_tls = true
# SMTP 登录用户名（多为完整邮箱）
user =
# SMTP 密码或邮箱授权码（勿提交到公开仓库）
password =
# 发件人地址（From）；可与 user 相同
from =
# SMTP 连接/发送超时（秒）
# timeout = 30
# 告警附件（截图）最大字节数，超过则不附带附件
# attach_max_bytes = 5242880

# ========================= 模型与检测扩展 =========================
[models]
# ---------- YOLO26 主检档位（改完须 ./stop.sh && ./start.sh）----------
# 官方文件名无中间的 v：yolo26s.pt（不是 yolov26s.pt）
# 下载：./scripts/download_yolo26.sh
#   或 https://github.com/ultralytics/assets/releases/tag/v8.4.0
# 档位（越大通常越准、越慢、越吃显存）：
#   models/yolo26n.pt  ~5MB   最快
#   models/yolo26s.pt  ~20MB  默认，平衡
#   models/yolo26m.pt  ~43MB
#   models/yolo26l.pt  ~51MB
#   models/yolo26x.pt  ~114MB 最准
# 对比精度时建议固定 conf_threshold 与同一路流，只改下一行：
yolo_model = models/yolo26s.pt
# 人体姿态（打电话/玩手机）；可与主检同档，如 yolo26m-pose.pt
pose_model = models/yolo26s-pose.pt
# 是否在人机框重叠后再跑姿态，以区分打电话与玩手机
pose_for_phone_enabled = true
# 姿态关键点最低置信度；低于此值不参与贴头/贴腕距离判定
phone_pose_kp_min_conf = 0.28
# 手机中心相对头部的距离比例阈值；小于该比例倾向判定为「打电话」
phone_call_head_ratio = 0.26
# 手机中心相对手腕的距离比例阈值；小于该比例倾向判定为「玩手机」
phone_play_wrist_ratio = 0.20
# 人体框竖直方向分界（0~1）；姿态关键点不足时的 fallback 分区
phone_vertical_boundary = 0.42

# ---------- 内置专模（与 YOLO COCO 并行；须在「检测类型配置」中按流开启）----------
# 打电话专模（ONNX）；可与姿态链路配合
make_call_model_path = models/make_call.onnx
# 是否启用 make_call 专模（false 时主要依赖姿态/COCO 逻辑）
make_call_use_dedicated = true
# 打电话专模是否要求与 COCO 人物框重叠
make_call_require_person_overlap = false
# 各专模未单独配置时的默认推理置信度
dedicated_default_conf = 0.40
# 各专模未单独配置时的默认告警分数阈值
dedicated_default_score_threshold = 0.45
# 各专模未单独配置时的默认持续时长（秒）
dedicated_default_min_duration_sec = 1.0

# ---------- 人员聚集 ----------
# 单帧检出人物数 ≥ 该值即满足人数条件（开「人员聚集」检测项时生效）
# gather_min_persons = 3
# 满足人数后需持续该秒数才告警；0 表示立即告警
# gather_min_duration_sec = 3

# ---------- 人脸识别（InsightFace buffalo_l）----------
# SCRFD 人脸检测 ONNX（det_10g.onnx）
face_recog_det_model_path = models/buffalo_l/det_10g.onnx
# ArcFace 特征提取 ONNX（w600k_r50.onnx）→ 512 维
face_recog_embed_model_path = models/buffalo_l/w600k_r50.onnx
# 性别/年龄属性 ONNX（可选）
face_recog_genderage_model_path = models/buffalo_l/genderage.onnx
# 性别年龄全局总开关；false 时即使流上勾选也不跑；真正启用还需在检测类型中勾选
face_recog_genderage_enabled = true
# SCRFD 人脸检测置信度阈值
face_recog_det_conf = 0.5
# 1:N 比对相似度阈值（余弦，越大越严）
face_recognition_threshold = 0.45
# 同一人需持续识别满该秒数才告警（防抖）
face_recognition_min_duration_sec = 2.0
# 推理前画面旋转角度：0 / 90 / 180 / 270（摄像头倒装时可调）
# face_recog_rotate = 0
# 人脸库本地目录（元数据在 Redis，照片在 MinIO；此目录作兼容/迁移）
# face_library_dir = ./face_library
# 每帧最多处理的人脸数（控算力）
# face_recognition_max_faces_per_frame = 5
# SCRFD 输入边长（像素，320~1280，常用 640）
# face_recog_det_size = 640

# 车牌识别（检测框 + RapidOCR 读号 + 车牌库 known/unknown）
# plate_det_model_path = models/specialists/plate/model.onnx
# plate_det_conf = 0.40
# plate_recognition_min_duration_sec = 1.0
# plate_recognition_ocr_min_conf = 0.35
# plate_recognition_max_plates_per_frame = 5

# ========================= C++ 推理守护进程（可选） =========================
[infer]
# python = Ultralytics 加载上面的 yolo_model（.pt，改档位最方便）
# cpp    = visionai-inferd（ONNX 在 models/repo/primary/；见 docs/architecture.md）
backend = python
# 同机 UDS
endpoint = unix:///tmp/visionai-inferd.sock
model_repository = models/repo
primary_name = primary
primary_version = 1
# fail = 生产默认；fallback_python = 开发可回退 Ultralytics
on_daemon_error = fail
# 空则继承 [basic] inference_device
# device =

# ========================= ZLMediaKit 媒体面（可选） =========================
[zlm]
# true=经 ZLM 拉流代理后再本地取流（docker compose up -d zlmediakit）
enabled = false
api_base = http://127.0.0.1:18080
# 须与 config/zlm/config.ini [api] secret 一致；勿使用 ZLM 出厂默认 UUID（会被拒绝/自动改写）
secret = jxvisionai-zlm-a7f3c91e4b2d6e80
vhost = __defaultVhost__
app = live
rtsp_port = 18554
http_port = 18080
prefer_local_pull = true
fallback_direct_rtsp = true
# 浏览器播放地址中的主机名（局域网 IP 或域名）；WebRTC 亦用作 ICE cand_udp
public_host = 127.0.0.1
# WebRTC ICE 端口（与 config/zlm/config.ini [rtc] 容器内 port、compose 宿主机 18000 映射一致）
rtc_port = 18000
# worker 容器拉 ZLM 本地 RTSP（compose 内设 ZLM_PULL_HOST=zlmediakit、ZLM_PULL_RTSP_PORT=554）
# pull_host =
# pull_rtsp_port =

# ========================= 国标 GB/T 28181（管理端配置存 Redis，不写本 ini） =========================
# Web「国标 28181」分三组，互不顶替：
#   A. SIP 信令：server_id / domain / bind_* / public_* / transport
#   B. 媒体收流：media_ip / media_port_range（仅 Invite SDP，每路一个 UDP 端口）
#   C. 设备账号：sip_user / auth_id / password / 通道编码 ID（「复制参数」给出）
# 进程：python -m visionai.sip 或 compose visionai-sip（宿主机 15060→5060）。
# 不启用 ZLM [sip]。worker 对 access_method=gb28181 直拉 rtsp://zlm/rtp/{device}_{channel}。

# ========================= 预览（标签绘制） =========================
[preview]
# 检测框标签字号（像素）：>0 固定；0=按帧短边×ratio 再夹在 min~max（改完重启）
# 流预览仅支持 ZLM WebRTC（见 [zlm]）
# label_font_px = 0
# label_font_min_px = 40
# label_font_max_px = 96
# label_font_ratio = 0.055
