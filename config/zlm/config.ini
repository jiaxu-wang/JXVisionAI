# ZLMediaKit 旁路配置（挂载到容器 /opt/media/conf/config.ini）
# 切勿使用 ZLM 出厂默认 secret（会被服务端拒绝/自动改写）；须与 config.ini [zlm] secret 一致

[api]
apiDebug=0
secret=jxvisionai-zlm-a7f3c91e4b2d6e80
defaultSnap=./www/logo.png
snapRoot=./www/snap/

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
streamNoneReaderDelayMS=20000
resetWhenRePlay=1
mergeWriteMS=0
mediaServerId=jxvisionai-zlm

[http]
port=80
sslport=443
rootPath=./www
dirMenu=1
notFound=<html><head><title>404</title></head><body bgcolor="white"><center><h1>您访问的资源不存在！</h1></center></body></html>
keepAliveSecond=30
maxReqSize=40960
sendBufSize=65536

[rtsp]
port=554
sslport=332
# WebRTC 播放必须关闭直连代理，否则可能缺 SPS/PPS 且 RTP 封装不被浏览器接受（HLS 不受影响）
directProxy=0
handshakeSecond=15
keepAliveSecond=15
lowLatency=0

[rtmp]
port=1935
sslport=19350
handshakeSecond=15
keepAliveSecond=15

[rtp]
audioMtuSize=1600
videoMtuSize=1400
rtpMaxSize=10

[rtp_proxy]
port=10000
timeoutSec=30
# openRtpServer 随机端口时的范围（平台也会按「媒体端口范围」显式占口）
port_range=10000-10200

[hls]
segDur=2
segNum=3
segRetain=5
fileBufSize=65536

[hook]
enable=0

# WebRTC 播放（浏览器预览）；容器内 8000，宿主机映射见 docker-compose（默认 18000）
[rtc]
port=8000
tcpPort=8000
# 浏览器可达 IP。本机浏览器用 127.0.0.1；局域网其它机器填宿主机 IP
# WSL2 + Windows 浏览器也建议 127.0.0.1，并优先 TCP（见 API preferred_tcp）
externIP=127.0.0.1
preferredCodecA=PCMA,PCMU,opus,mpeg4-generic
preferredCodecV=H264,H265,VP9,VP8
timeoutSec=15
