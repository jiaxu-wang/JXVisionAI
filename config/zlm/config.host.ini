# ./start.sh 用 host 网络跑 ZLM：端口直接绑在宿主机上（与 SIP :15060 一样）。
# 这样摄像头推 PS/RTP 到 192.168.x.x:10000 不会被 docker-proxy 吃掉。
# 切勿使用 ZLM 出厂默认 secret；须与 config.ini [zlm] secret 一致。

[api]
apiDebug=0
secret=jxvisionai-zlm-a7f3c91e4b2d6e80
defaultSnap=./www/logo.png
snapRoot=./www/snap/

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
streamNoneReaderDelayMS=20000
resetWhenRePlay=1
mergeWriteMS=0
mediaServerId=jxvisionai-zlm

[http]
port=18080
sslport=0
rootPath=./www
dirMenu=1
notFound=<html><head><title>404</title></head><body bgcolor="white"><center><h1>您访问的资源不存在！</h1></center></body></html>
keepAliveSecond=30
maxReqSize=40960
sendBufSize=65536

[rtsp]
port=18554
sslport=0
directProxy=0
handshakeSecond=15
keepAliveSecond=15
lowLatency=0

[rtmp]
port=11935
sslport=0
handshakeSecond=15
keepAliveSecond=15

[rtp]
audioMtuSize=1600
videoMtuSize=1400
rtpMaxSize=10

[rtp_proxy]
port=10000
timeoutSec=30
port_range=10000-10200

[hls]
segDur=2
segNum=3
segRetain=5
fileBufSize=65536

[hook]
enable=0

[shell]
port=0

[rtc]
port=18000
tcpPort=18000
externIP=127.0.0.1
preferredCodecA=PCMA,PCMU,opus,mpeg4-generic
preferredCodecV=H264,H265,VP9,VP8
timeoutSec=15
