# ./start.sh 用 host 网络跑 ZLM：端口直接绑在宿主机上（与 SIP :15060 一样）。
# 这样摄像头推 PS/RTP 到 192.168.x.x:32000 起的收流段不会被 docker-proxy 吃掉。
# 切勿使用 ZLM 出厂默认 secret。下面是仓库公开演示值，生产必须轮换并与 [zlm] secret / ZLM_SECRET 一致。

[api]
apiDebug=0
secret = b1ee63c44d0d2674a43d26d87fabb516f7e4e14ec87ddda0
defaultSnap=./www/logo.png
snapRoot=./www/snap/

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
streamNoneReaderDelayMS=20000
resetWhenRePlay=1
mergeWriteMS=0
mediaServerId=jxvisionai-zlm

[http]
port=80
sslport=443
rootPath=./www
dirMenu=1
notFound=<html><head><title>404</title></head><body bgcolor="white"><center><h1>您访问的资源不存在！</h1></center></body></html>
keepAliveSecond=30
maxReqSize=40960
sendBufSize=65536

[rtsp]
port=554
sslport=0
directProxy=0
handshakeSecond=15
keepAliveSecond=15
lowLatency=0

[rtmp]
port=1937
sslport=0
handshakeSecond=15
keepAliveSecond=15

[rtp]
audioMtuSize=1600
videoMtuSize=1400
rtpMaxSize=10

[rtp_proxy]
port=32000
timeoutSec=30
port_range=32000-32999

[hls]
segDur=2
segNum=3
segRetain=5
fileBufSize=65536

[hook]
enable=0

[shell]
port=0

[srt]
# 默认 9000，与同机 inrico zlm 冲突。本服务不用 SRT。
port=0

[rtc]
port=8003
tcpPort=8003
# 独立 WebRTC 信令口。平台占 3000/3001，hikdevai 占 3002/3003。
signalingPort=3003
signalingSslPort=3004
# STUN/TURN。默认 3478，已被平台 zlm 占用。预览走上面的 8003，这里关闭。
icePort=0
iceTcpPort=0
externIP=127.0.0.1
preferredCodecA=PCMA,PCMU,opus,mpeg4-generic
preferredCodecV=H264,H265,VP9,VP8
timeoutSec=15
