# 吸烟检测模型训练配置示例
# 项目名称: smoking_detection
# 创建日期: 2026-04-13

# ==================== 数据配置 ====================
data:
  # 数据配置文件路径（训练时会自动生成）
  data_yaml_path: "configs/data_smoking.yaml"
  
  # 原始数据目录
  raw_data_dir: "data/raw"
  
  # 训练集比例
  train_ratio: 0.7
  
  # 验证集比例
  val_ratio: 0.2
  
  # 检测类别（按顺序）
  classes:
    - person
    - smoking
    - cigarette
    - smoke

# ==================== 训练配置 ====================
training:
  # 预训练模型
  pretrained_model: "yolo26s.pt"
  
  # 训练轮数
  epochs: 100
  
  # 批次大小（根据GPU内存调整）
  batch_size: 16
  
  # 输入图像大小
  img_size: 640
  
  # 训练设备（0=GPU, cpu=CPU）
  device: "0"
  
  # 数据加载工作进程数
  workers: 8
  
  # 项目输出目录
  project_dir: "outputs"
  
  # 实验名称
  experiment_name: "smoking_detection"
  
  # 优化器（auto, SGD, Adam, Adamax）
  optimizer: "auto"
  
  # 初始学习率
  lr0: 0.01
  
  # 是否使用余弦学习率调度
  cos_lr: true
  
  # 是否恢复训练
  resume: false

# ==================== 验证配置 ====================
validation:
  # 置信度阈值
  conf_threshold: 0.25
  
  # IoU阈值
  iou_threshold: 0.45

# ==================== 数据预处理配置 ====================
preprocessing:
  # 是否预处理图像
  enabled: true
  
  # 目标图像大小
  target_size: 640
  
  # 是否数据增强（仅训练集）
  augment: true

# ==================== 部署配置 ====================
deployment:
  # 目标部署目录
  target_dir: "../"
  
  # 部署模型文件名
  model_name: "smoking_detection.pt"
  
  # 导出格式
  export_format: "onnx"
