<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#03A9F4"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="200" fill="url(#bg)" rx="24"/>
  
  <!-- 现代相机图标 -->
  <g transform="translate(50, 40)">
    <!-- 相机主体 -->
    <rect x="0" y="0" width="100" height="80" rx="12" fill="white" opacity="0.9"/>
    
    <!-- 镜头 -->
    <circle cx="50" cy="40" r="25" fill="url(#icon)"/>
    <circle cx="50" cy="40" r="15" fill="#1976D2"/>
    <circle cx="50" cy="40" r="5" fill="white"/>
    
    <!-- 相机顶部 -->
    <rect x="35" y="-10" width="30" height="10" rx="5" fill="white" opacity="0.9"/>
    
    <!-- AI 元素 -->
    <path d="M10,70 L30,70 L30,90 L10,90 Z" fill="#FF5722"/>
    <path d="M40,70 L60,70 L60,90 L40,90 Z" fill="#4CAF50"/>
    <path d="M70,70 L90,70 L90,90 L70,90 Z" fill="#FFC107"/>
  </g>
  
  <!-- VisionAI 文字 -->
  <text x="100" y="170" font-family="'Segoe UI', 'Roboto', sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="white">VisionAI</text>
  
  <!-- 装饰元素 -->
  <circle cx="30" cy="30" r="8" fill="white" opacity="0.3"/>
  <circle cx="170" cy="30" r="5" fill="white" opacity="0.3"/>
  <circle cx="170" cy="170" r="10" fill="white" opacity="0.2"/>
  <circle cx="30" cy="170" r="6" fill="white" opacity="0.2"/>
</svg>