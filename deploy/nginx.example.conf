# HTTPS 反代示例（Nginx）
# 将 JXVisionAI API（:5000）与可选 ZLM（:8080）置于 TLS 之后

upstream visionai_api {
    server 127.0.0.1:5000;
    keepalive 8;
}

upstream visionai_zlm {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name visionai.example.com;

    ssl_certificate     /etc/ssl/certs/visionai.crt;
    ssl_certificate_key /etc/ssl/private/visionai.key;

    # 管理端 / API
    location / {
        proxy_pass http://visionai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        client_max_body_size 512m;
    }

    # ZLM 播放（HLS/FLV），勿对外暴露 ZLM secret API
    location /zlm/ {
        proxy_pass http://visionai_zlm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 阻断敏感 API
        location /zlm/index/api/ {
            return 403;
        }
    }
}

server {
    listen 80;
    server_name visionai.example.com;
    return 301 https://$host$request_uri;
}
